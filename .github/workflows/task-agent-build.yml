# =============================================================================
# Build - task-agent (CI + Registry only)
# =============================================================================
# Purpose:
#   Builds the task-manager-agent Docker image and pushes it to GitHub
#   Container Registry (ghcr.io/asifalishaikh/task-manager-agent/task-manager-agent).
#
# This is CI + delivery to registry — NOT full CD (no auto-deploy to a
# live server). Full CD (auto-deploy to K8s) will be added in Part 3.
#
# Triggers:
#   - Push to master that changes services/task-manager-agent/** or this workflow file
#   - Pull request to master that changes services/task-manager-agent/**
#
# Tags pushed:
#   - Branch name (e.g., master)
#   - Commit SHA (e.g., sha-a1b2c3d)
#   - Semver tag (e.g., v0.1.0) when a git tag is pushed
#
# Pull requests: build only, no push to registry.
# =============================================================================
name: Build - task-agent

on:
  push:
    branches: [master]
    paths:
      - 'services/task-manager-agent/**'
      - '.github/workflows/task-agent-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'services/task-manager-agent/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sandbox-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/task-manager-agent
          file: services/task-manager-agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
